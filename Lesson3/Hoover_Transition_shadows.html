<HTML>
    <head>
        <style>
            .subscribe-button
            {
                background-color: rgb(200 0 0);
                color:rgb(235 255 255);
                border:none;
                height: 36px;
                width: 105px;
                border-radius: 2px;
                cursor: pointer;
                margin-right: 8px;
                transform: opacity 1s;

            }
            .subscribe-button:hover
            {
                opacity: 0.8;
            }
            .subscribe-button:active
            {
                opacity: 0.4;
            }
            .join-button
            {
                background-color: white;
                border-color: rgb(41 56 78);
                border-style: solid;
                border-width: 1px;
                color:rgb(41 118 211);
                height: 36px;
                width: 62px;
                border-radius: 2px;
                cursor: pointer;
                transition: background-color 0.5s, color 0.5s;
            }
            .join-button:hover
            {
                background-color: rgb(41 118 211);
                color: white;
            }
            .join-button:active
            {
                opacity: 0.5;
            }
            
            .tweet-button
            {
                background-color: blue;
                color: rgb(255 255 255);
                border: none;
                height: 36px;
                width: 74px;
                border-radius: 18px;
                font-weight: bold;
                font-size: 15px;
                cursor: pointer;
                margin-left: 8px;
                transition: box-shadow 0.5s;
            }
            .tweet-button:hover
            {
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
            }
        </style>
    </head>
    <body>
        <button class="subscribe-button">SUBSCRIB</button>
        <button class="Join-button">JOIN</button>
        <button class="Tweet-button">TWEET</button>
    </body>
</HTML>
