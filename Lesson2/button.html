<HTML>
    <head>
        <style>
            .subscribe-button
            {
                background-color: red;
                color:rgb(235 255 255);
                border:none;
                height: 36px;
                width: 105px;
                border-radius: 2px;
                cursor: pointer;
                margin-right: 8px;

            }
            .join-button
            {
                background-color: white;
                border-color: rgb( 41 56 78);
                border-style: solid;
                border-width: 1px;
                color:rgb(41 118 211);
                height: 36px;
                width: 62px;
                border-radius: 2px;
                cursor: pointer;
            }
            .tweet-button
            {
                background-color: blue;
                color: rgb(255 255 255);
                border: none;
                height: 36px;
                width: 74px;
                border-radius: 18px;
                font-weight: bold;
                font-size: 15px;
                cursor: pointer;
                margin-left: 8px;
            }
        </style>
    </head>
    <body>
        <button class="subscribe-button">SUBSCRIB</button>
        <button class="Join-button">JOIN</button>
        <button class="Tweet-button">TWEET</button>
    </body>
</HTML>
